<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman OSIS SMA Bruderan Purwokerto</title>
    <!-- Import Font Poppins dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Desain UI modern dan bersih */
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            /* Background gradien biru modern */
            background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container { 
            background: rgba(255, 255, 255, 0.98); 
            padding: 3rem 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 550px; 
            text-align: center; 
            position: relative;
            overflow: hidden;
        }

        /* Hiasan atas kartu */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(to right, #0052D4, #4364F7);
        }

        .icon-header {
            font-size: 3rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 { 
            color: #1e293b; 
            font-size: 1.8rem; 
            font-weight: 700;
            margin-bottom: 0.2rem; 
            margin-top: 0;
        }
        p.subtitle { 
            color: #64748b; 
            margin-bottom: 2.5rem; 
            font-weight: 500;
            font-size: 1.1rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input[type="text"] { 
            width: 100%; 
            padding: 16px 20px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 1.05rem;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #4364F7;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(67, 100, 247, 0.1);
        }
        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        button { 
            background: linear-gradient(to right, #4364F7, #6FB1FC); 
            color: white; 
            border: none; 
            padding: 16px 24px; 
            font-size: 1.1rem; 
            font-family: 'Poppins', sans-serif;
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.3s ease;
            font-weight: 600;
            width: 100%;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.3);
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 100, 247, 0.4);
        }
        button:active {
            transform: translateY(1px);
        }
        
        /* Desain Surat Pengumuman */
        .result-card { 
            margin-top: 2rem; 
            padding: 2rem 1.5rem; 
            border-radius: 16px; 
            display: none; 
            text-align: left; 
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .result-card h3 {
            margin-top: 0;
            padding-bottom: 15px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .accepted { 
            background-color: #f0fdf4; 
            color: #166534; 
            border: 1px solid #bbf7d0; 
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.1);
        }
        .accepted h3 { border-bottom: 2px solid #22c55e; }

        .rejected { 
            background-color: #fef2f2; 
            color: #991b1b; 
            border: 1px solid #fecaca;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.1);
        }
        .rejected h3 { border-bottom: 2px solid #ef4444; }

        .warning { 
            background-color: #fffbeb; 
            color: #92400e; 
            border: 1px solid #fde68a; 
            text-align: center;
        }

        .result-card p {
            line-height: 1.6;
            margin-bottom: 10px;
            color: #334155;
        }
        .result-card strong {
            color: #0f172a;
        }
        
        /* Footer pengumuman */
        .ttd {
            margin-top: 25px;
            font-style: italic;
            color: #64748b;
            text-align: right;
            border-top: 1px dashed #cbd5e1;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-header">🎓</div>
        <h1>Pengumuman Seleksi OSIS</h1>
        <p class="subtitle">SMA Bruderan Purwokerto 2026/2027</p>

        <div class="input-group">
            <input type="text" id="nameInput" placeholder="Masukkan Nama Lengkap Anda..." autocomplete="off">
        </div>
        <button onclick="checkStatus()">Cek Hasil Seleksi</button>

        <div id="resultContainer" class="result-card"></div>
    </div>

    <script>
        // DAFTAR NAMA YANG DITERIMA (Sesuai dengan daftar terbaru)
        // Ditulis huruf kecil semua untuk mempermudah pencocokan sistem
        const daftarDiterima = [
            "jonaskhan christian jati wibowo",
            "stevano raditya alvaro",
            "richard roffa edshe hertaliem",
            "samuel gerrard nevan wibowo",
            "valentinus samuel yudhistira",
            "viola felicia sihombing",
            "caroline thian zakila setiawan",
            "jessica etsy amarise",
            "oliva louise christabel",
            "ilovia christi avira wijayanto",
            "rafael hardianto",
            "faithlene nauli lim",
            "yonathan nathanael kurniawan",
            "edward halomoan marpaung",
            "eunike cristabella wijaya",
            "dionisius azriel turnip",
            "yehezkiel ivander arietama",
            "bryan immanuel",
            "devan manuel tristan",
            "kevin setiawan",
            "julia evelyna",
            "keith nielsen yap",
            "gracio mahameru syallom"
        ];

        function checkStatus() {
            let inputName = document.getElementById('nameInput').value.toLowerCase().trim();
            // Spasi ganda di tengah nama diganti menjadi spasi tunggal
            inputName = inputName.replace(/\s+/g, ' '); 
            
            const resultContainer = document.getElementById('resultContainer');
            
            // Reset animasi dengan cara me-retrigger reflow
            resultContainer.style.display = 'none';
            void resultContainer.offsetWidth; 
            resultContainer.style.display = 'block';

            if (inputName === "") {
                resultContainer.className = 'result-card warning';
                resultContainer.innerHTML = "⚠️ <strong>Perhatian:</strong> Harap masukkan nama lengkap Anda terlebih dahulu.";
                return;
            }

            // Memformat nama agar huruf awalnya kapital (Title Case)
            const formattedName = inputName.replace(/\b\w/g, char => char.toUpperCase());

            if (daftarDiterima.includes(inputName)) {
                // Surat Diterima
                resultContainer.className = 'result-card accepted';
                resultContainer.innerHTML = `
                    <h3>✅ Selamat, Anda Lolos!</h3>
                    <p>Yth. <strong>${formattedName}</strong>,</p>
                    <p>Berdasarkan hasil seleksi, Anda dinyatakan <strong>DITERIMA</strong> sebagai pengurus OSIS SMA Bruderan Purwokerto Masa Bakti 2026/2027.</p>
                    <p>Langkah selanjutnya, harap menghadiri rapat perdana di Ruang OSIS sesuai jadwal yang telah ditentukan oleh panitia.</p>
                    <div class="ttd">Panitia Seleksi OSIS<br>SMA Bruderan Purwokerto</div>
                `;
            } else {
                // Surat Ditolak
                resultContainer.className = 'result-card rejected';
                resultContainer.innerHTML = `
                    <h3>❌ Tetap Semangat!</h3>
                    <p>Yth. <strong>${formattedName}</strong>,</p>
                    <p>Mohon maaf, Anda dinyatakan <strong>BELUM DITERIMA</strong> sebagai pengurus OSIS SMA Bruderan Purwokerto Masa Bakti 2026/2027.</p>
                    <p>Terima kasih atas partisipasi dan antusiasme Anda. Jangan patah semangat dan teruslah berkarya di kesempatan lainnya!</p>
                    <div class="ttd">Panitia Seleksi OSIS<br>SMA Bruderan Purwokerto</div>
                `;
            }
        }
        
        // Memungkinkan user menekan tombol "Enter" di keyboard untuk mengecek
        document.getElementById("nameInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkStatus();
            }
        });
    </script>
</body>
</html>
